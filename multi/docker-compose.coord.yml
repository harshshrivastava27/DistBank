# Coordinator laptop: etcd, HAProxy, coord-db, coordinator, dashboard.
# Start with:  ./multi/cluster.sh coord up
name: distbank-coord

x-app: &app
  build: ../app
  image: distbank-app
  environment: &app-env
    PYTHONUNBUFFERED: "1"
    # Dashboard/tests reach each node at <laptop ip>:<its ports>.
    PG_A1_IP: ${PG_A1_IP}
    PG_A2_IP: ${PG_A2_IP}
    PG_A3_IP: ${PG_A3_IP}
    PG_B1_IP: ${PG_B1_IP}
    PG_B2_IP: ${PG_B2_IP}
    PG_B3_IP: ${PG_B3_IP}

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    container_name: etcd
    command:
      - etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      # Patroni on the other laptops discovers etcd through this address.
      - --advertise-client-urls=http://${COORD_IP}:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data

  haproxy:
    image: haproxy:2.8
    container_name: haproxy
    environment:
      PG_A1_IP: ${PG_A1_IP}
      PG_A2_IP: ${PG_A2_IP}
      PG_A3_IP: ${PG_A3_IP}
      PG_B1_IP: ${PG_B1_IP}
      PG_B2_IP: ${PG_B2_IP}
      PG_B3_IP: ${PG_B3_IP}
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      - "8404:7000"
      - "5500:5000"
      - "5501:5001"
      - "5502:5002"
      - "5503:5003"

  coord-db:
    image: postgres:16
    container_name: coord-db
    environment:
      POSTGRES_USER: coord
      POSTGRES_PASSWORD: coord-demo
      POSTGRES_DB: coord
    volumes:
      - coord-data:/var/lib/postgresql/data

  coordinator:
    <<: *app
    container_name: coordinator
    command: ["uvicorn", "bank.coordinator:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on: [haproxy, coord-db]
    restart: "no"

  dashboard:
    <<: *app
    container_name: dashboard
    command: ["uvicorn", "bank.dashboard:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8080:8080"
    depends_on: [haproxy, coord-db]

  loadgen:
    <<: *app
    container_name: loadgen
    command: ["python", "-m", "bank.loadgen"]
    profiles: ["tools"]

volumes:
  coord-data:
  etcd-data:
