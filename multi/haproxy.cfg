# HAProxy for the multi-laptop setup. Same listeners as ../haproxy/haproxy.cfg,
# but each node is addressed as <laptop IP>:<its published port>. The IPs come
# from environment variables (set from cluster.env by docker-compose.coord.yml).
# "check port 80xx" asks that node's Patroni API whether it is primary/replica.

global
    maxconn 2000
    log stdout format raw local0 notice

defaults
    mode tcp
    log global
    retries 2
    timeout connect 3s
    timeout client  30m
    timeout server  30m
    timeout check   2s

listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /
    stats refresh 2s
    stats show-legends

listen branch_a_write
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg-a1 "${PG_A1_IP}:5411" check port 8011
    server pg-a2 "${PG_A2_IP}:5412" check port 8012
    server pg-a3 "${PG_A3_IP}:5413" check port 8013

listen branch_a_read
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg-a1 "${PG_A1_IP}:5411" check port 8011
    server pg-a2 "${PG_A2_IP}:5412" check port 8012
    server pg-a3 "${PG_A3_IP}:5413" check port 8013

listen branch_b_write
    bind *:5002
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg-b1 "${PG_B1_IP}:5421" check port 8021
    server pg-b2 "${PG_B2_IP}:5422" check port 8022
    server pg-b3 "${PG_B3_IP}:5423" check port 8023

listen branch_b_read
    bind *:5003
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
    server pg-b1 "${PG_B1_IP}:5421" check port 8021
    server pg-b2 "${PG_B2_IP}:5422" check port 8022
    server pg-b3 "${PG_B3_IP}:5423" check port 8023
