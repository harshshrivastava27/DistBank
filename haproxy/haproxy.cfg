# HAProxy: the single entry point to both database clusters.
#
# Ports inside the Docker network (docker-compose.yml maps them to other
# numbers on your own machine: 5500-5503 and 8404):
#   port 5000  Branch A writes -> whichever node is currently PRIMARY
#   port 5001  Branch A reads  -> round-robin across the REPLICAS
#   port 5002  Branch B writes
#   port 5003  Branch B reads
#   port 7000  statistics page (http://localhost:8404 from your browser)
#
# HAProxy finds out each node's role by asking Patroni's REST API on port 8008:
#   GET /primary  -> 200 only on the primary
#   GET /replica  -> 200 only on a healthy, streaming replica
# After a failover the answers change and traffic follows automatically.

global
    maxconn 2000
    log stdout format raw local0 notice

defaults
    mode tcp
    log global
    retries 2
    timeout connect 3s
    timeout client  30m
    timeout server  30m
    timeout check   2s

# Docker's built-in DNS. Lets HAProxy start (and keep running) even when a
# database container is stopped and its name temporarily does not resolve.
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid      5s
    hold nx         5s
    hold other      5s
    hold timeout    5s

listen stats
    bind *:7000
    mode http
    stats enable
    stats uri /
    stats refresh 2s
    stats show-legends

listen branch_a_write
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions init-addr libc,none resolvers docker
    server pg-a1 pg-a1:5432 check port 8008
    server pg-a2 pg-a2:5432 check port 8008
    server pg-a3 pg-a3:5432 check port 8008

listen branch_a_read
    bind *:5001
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions init-addr libc,none resolvers docker
    server pg-a1 pg-a1:5432 check port 8008
    server pg-a2 pg-a2:5432 check port 8008
    server pg-a3 pg-a3:5432 check port 8008

listen branch_b_write
    bind *:5002
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions init-addr libc,none resolvers docker
    server pg-b1 pg-b1:5432 check port 8008
    server pg-b2 pg-b2:5432 check port 8008
    server pg-b3 pg-b3:5432 check port 8008

listen branch_b_read
    bind *:5003
    balance roundrobin
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions init-addr libc,none resolvers docker
    server pg-b1 pg-b1:5432 check port 8008
    server pg-b2 pg-b2:5432 check port 8008
    server pg-b3 pg-b3:5432 check port 8008
